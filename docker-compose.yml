version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scribes_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scribes
      POSTGRES_USER: scribes
      POSTGRES_PASSWORD: scribes_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribes -d scribes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scribes_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://scribes:scribes_secret@db:5432/scribes?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      PORT: 8080
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-scribes}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate
    container_name: scribes_migrate
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://scribes:scribes_secret@db:5432/scribes?sslmode=disable
      - up
    volumes:
      - ./backend/migrations:/migrations

volumes:
  pgdata:
