name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  id-token: write # Required for Google Cloud Workload Identity Federation (Keyless Auth)

jobs:
  # ══════════════════════════════════════════════════════════════
  # STAGE 1: CONTINUOUS INTEGRATION (Test & Verify)
  # ══════════════════════════════════════════════════════════════
  test:
    name: Run Go Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Verify API binary builds
        run: CGO_ENABLED=0 go build -v ./cmd/api

      - name: Run unit tests
        run: go test -v ./...

  # ══════════════════════════════════════════════════════════════
  # STAGE 2: CONTINUOUS DEPLOYMENT (Deploy to Google Cloud Run)
  # ══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/773705773175/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@scribes-501422.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy scribes-api \
            --source backend \
            --region us-central1 \
            --quiet
