name: Scribes CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # BACKEND: GO & POSTGRESQL
  # ==========================================
  backend-checks:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        run: go mod download

      # Relaxed linting for early sprints (just checks if it builds)
      - name: Verify Build
        run: go build -v ./...

      - name: Run Go Unit Tests
        run: go test -v ./...

